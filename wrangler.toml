# Cloudflare Pages — synos-linux.pro
# Used by `wrangler pages deploy` for manual deploys; the GitHub Action
# in .github/workflows/deploy-cloudflare.yml is the primary CI deploy path.

name = "synos-linux-pro"
compatibility_date = "2026-05-09"
pages_build_output_dir = "./dist"

[vars]
# Public, build-time environment for the static site.
# Anything secret must go in GitHub Actions secrets, not here.
SITE_URL = "https://synos-linux.pro"

# Private R2 bucket holding the members-only Church of Malware ISO. Served ONLY
# through the Cloudflare Access-gated /download/* Pages Function
# (functions/download/*). The bucket must have NO public r2.dev / custom-domain
# access — the gated Function is the sole path to the bytes. Create it with:
#   npx wrangler r2 bucket create synos-iso
[[r2_buckets]]
binding = "ISO_BUCKET"
bucket_name = "synos-iso"

# KV allowlist of current members, keyed by the identity the /download gate can
# verify (member:<discord-id>). Populated out-of-band by a nightly job on a
# mesh node (see the discord-harvester repo) — this repo only READS it, so no
# member data or harvesting mechanism is exposed here. Values self-expire (TTL)
# so a stalled sync revokes access rather than granting it forever.
# Create the namespace with:  npx wrangler kv namespace create MEMBER_KV
# then paste its id below (and a *_preview id for `wrangler pages dev`).
[[kv_namespaces]]
binding = "MEMBER_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
